function BarChart({ data, h = 230, colorFn }) {
  const W = 560, H = h, pl = 34, pb = 30, pt = 16, pr = 8, iw = W - pl - pr, ih = H - pt - pb, bw = iw / data.length;
  const y = (v) => pt + ih - (v / 100) * ih;
  return html`<svg viewBox=${`0 0 ${W} ${H}`} class="h-auto w-full" role="img" aria-label="Bar chart">
    ${[0, 25, 50, 75, 100].map((g) => html`<g key=${g}><line x1=${pl} x2=${W - pr} y1=${y(g)} y2=${y(g)} stroke=${g === 75 ? '#F59E0B' : '#E2E8F0'} strokeDasharray=${g === 75 ? '4 4' : '0'} /><text x=${pl - 6} y=${y(g) + 4} textAnchor="end" fontSize="10" fill="#64748B">${g}</text></g>`)}
    ${data.map((d, i) => { const x = pl + i * bw + bw * 0.2, w = bw * 0.6; return html`<g key=${d.label}>
      <rect x=${x} y=${y(d.value)} width=${w} height=${pt + ih - y(d.value)} rx="6" fill=${colorFn ? colorFn(d.value) : '#0E2144'} />
      <text x=${x + w / 2} y=${y(d.value) - 6} textAnchor="middle" fontSize="11" fontWeight="700" fill="#0A1A38">${Math.round(d.value)}</text>
      <text x=${x + w / 2} y=${H - 10} textAnchor="middle" fontSize="10" fill="#64748B">${d.label}</text></g>`; })}
  </svg>`;
}
function LineChart({ data, h = 230 }) {
  const W = 560, H = h, pl = 34, pb = 30, pt = 16, pr = 14, iw = W - pl - pr, ih = H - pt - pb, lo = 60, hi = 100;
  const x = (i) => pl + (i * iw) / (data.length - 1), y = (v) => pt + ih - ((v - lo) / (hi - lo)) * ih;
  const pts = data.map((d, i) => `${x(i)},${y(d.value)}`).join(' ');
  const area = `${x(0)},${pt + ih} ${pts} ${x(data.length - 1)},${pt + ih}`;
  return html`<svg viewBox=${`0 0 ${W} ${H}`} class="h-auto w-full" role="img" aria-label="Line chart">
    ${[60, 70, 80, 90, 100].map((g) => html`<g key=${g}><line x1=${pl} x2=${W - pr} y1=${y(g)} y2=${y(g)} stroke="#E2E8F0" /><text x=${pl - 6} y=${y(g) + 4} textAnchor="end" fontSize="10" fill="#64748B">${g}</text></g>`)}
    <polygon points=${area} fill="#06B6D4" fillOpacity="0.12" />
    <polyline points=${pts} fill="none" stroke="#0E2144" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
    ${data.map((d, i) => html`<g key=${d.label}><circle cx=${x(i)} cy=${y(d.value)} r=${i === data.length - 1 ? 6 : 4} fill=${i === data.length - 1 ? '#06B6D4' : '#fff'} stroke="#0E2144" strokeWidth="2.5" />
      <text x=${x(i)} y=${y(d.value) - 11} textAnchor="middle" fontSize="11" fontWeight="700" fill="#0A1A38">${d.value.toFixed(1)}</text>
      <text x=${x(i)} y=${H - 10} textAnchor="middle" fontSize="10" fill="#64748B">${d.label}</text></g>`)}
  </svg>`;
}

/* ---------- QR (decorative, seeded) ---------- */
function mulberry(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function QR({ seed, size = 200, fg = '#0A1A38', dim = false }) {
  const N = 25;
  const d = useMemo(() => {
    const r = mulberry(seed), corners = [[0, 0], [N - 7, 0], [0, N - 7]];
    let p = '';
    for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) {
      let dark = null;
      for (const [cx0, cy0] of corners) {
        const dx = xx - cx0, dy = yy - cy0;
        if (dx >= -1 && dx <= 7 && dy >= -1 && dy <= 7) {
          dark = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6 && (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
        }
      }
      if (xx >= 16 && xx <= 20 && yy >= 16 && yy <= 20) { const ax = xx - 16, ay = yy - 16; dark = ax === 0 || ax === 4 || ay === 0 || ay === 4 || (ax === 2 && ay === 2); }
      if (dark === null) dark = r() > 0.52;
      if (dark) p += `M${xx} ${yy}h1v1h-1z`;
    }
    return p;
  }, [seed]);
  return html`<svg width=${size} height=${size} viewBox=${`-2 -2 ${N + 4} ${N + 4}`} style=${{ opacity: dim ? 0.55 : 1, maxWidth: '100%' }} role="img" aria-label="Simulated QR code" shapeRendering="crispEdges"><rect x="-2" y="-2" width=${N + 4} height=${N + 4} fill="#fff" /><path d=${d} fill=${fg} /></svg>`;
}

function Modal({ children, onClose, wide }) {
  useEffect(() => { const k = (e) => e.key === 'Escape' && onClose(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  return html`<div class="fixed inset-0 z-[90] flex items-end justify-center bg-navy-950/60 p-0 backdrop-blur-sm sm:items-center sm:p-4" onClick=${onClose}>
    <div class=${cx('anim-pop max-h-[95vh] w-full overflow-y-auto rounded-t-3xl bg-white shadow-2xl sm:rounded-3xl', wide ? 'sm:max-w-2xl' : 'sm:max-w-md')} onClick=${(e) => e.stopPropagation()}>${children}</div></div>`;
}

/* ---- simulated QR scanner ---- */
function Scanner({ app, onClose }) {
  const [phase, setPhase] = useState('ready');
  const [steps, setSteps] = useState(['idle', 'idle']);
  const [res, setRes] = useState(null);
  const [menu, setMenu] = useState(false);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const later = (fn, ms) => timers.current.push(setTimeout(fn, ms));
  const s0 = app.st, live = s0.live, lec = live && s0.lectures.find((l) => l.id === live.lectureId);

  const fail = (reason, count) => { setPhase('result'); setRes({ ok: false, reason }); if (count) app.failAttempt(ME_ID, reason); else app.notify('error', 'Verification failed', reason); };
  const run = (failure) => {
    setPhase('verifying'); setMenu(false); setSteps(['run', 'idle']);
    later(() => {
      const s = app.getState();
      let f = failure;
      if (!f && !s.live) { setSteps(['fail', 'idle']); return fail('No active lecture. Ask the faculty to start the lecture first.', false); }
      if (f && f.step === 0) { setSteps(['fail', 'idle']); return fail(f.reason, true); }
      setSteps(['ok', 'run']);
      later(() => {
        if (f && f.step === 1) { setSteps(['ok', 'fail']); return fail(f.reason, true); }
        const r = app.markPresent(ME_ID, 'QR + BLE');
        if (!r.ok) { setSteps(['ok', 'fail']); return fail('Attendance is already recorded for this lecture.', false); }
        setSteps(['ok', 'ok']); setPhase('result');
        setRes({ ok: true, time: r.time, lec: r.lec, rssi: -rand(52, 64), dist: (rand(21, 48) / 10).toFixed(1) });
        app.notify('success', 'Attendance marked', `${r.lec.title} at ${r.time}`);
      }, 1300);
    }, 1000);
  };
  const stepRow = (i, title, sub) => { const s = steps[i]; return html`<li class="flex items-center gap-3 rounded-xl border border-slate-200 p-3">
    <span class=${cx('flex h-8 w-8 items-center justify-center rounded-full text-white', s === 'ok' ? 'bg-emerald-500' : s === 'fail' ? 'bg-rose-500' : s === 'run' ? 'bg-cyan-500' : 'bg-slate-200')}>${s === 'ok' ? html`<${Icon} n="check" c="h-4 w-4" />` : s === 'fail' ? html`<${Icon} n="x" c="h-4 w-4" />` : s === 'run' ? html`<span class="anim-blink h-2.5 w-2.5 rounded-full bg-white"></span>` : html`<${Icon} n=${i === 0 ? 'qr' : 'bt'} c="h-4 w-4" />`}</span>
    <div><p class="text-sm font-semibold text-navy-900">${title}</p><p class="text-xs text-slate-500">${s === 'run' ? 'Checking…' : s === 'ok' ? 'Passed' : s === 'fail' ? 'Failed' : sub}</p></div></li>`; };

  return html`<${Modal} onClose=${onClose}>
    <div class="flex items-center justify-between bg-navy-900 px-5 py-4 text-white"><div class="flex items-center gap-2.5"><${Icon} n="camera" c="h-5 w-5 text-cyan-300" /><span class="font-display text-sm font-semibold">Scan lecture QR</span></div><button onClick=${onClose} class="rounded-lg p-1.5 hover:bg-white/10" aria-label="Close scanner"><${Icon} n="x" c="h-5 w-5" /></button></div>
    <div class="space-y-4 p-5">
      <div class="rounded-lg bg-amber-50 px-3 py-2 text-center text-[11px] font-bold text-amber-800">DEMO MODE: camera and Bluetooth are simulated</div>
      ${phase === 'ready' && html`<div>
        <div class="relative mx-auto flex aspect-square w-full max-w-[300px] items-center justify-center overflow-hidden rounded-2xl bg-navy-950">
          <${QR} seed=${live ? 4242 : 99} size=${200} fg="#7DD3FC" dim=${true} />
          <div class="absolute h-0.5 w-[85%] bg-cyan-400 shadow-[0_0_14px_3px_rgba(34,211,238,.8)]" style=${{ animation: 'scan 2.4s ease-in-out infinite' }}></div>
          ${['left-3 top-3 border-l-4 border-t-4 rounded-tl-xl', 'right-3 top-3 border-r-4 border-t-4 rounded-tr-xl', 'left-3 bottom-3 border-l-4 border-b-4 rounded-bl-xl', 'right-3 bottom-3 border-r-4 border-b-4 rounded-br-xl'].map((c) => html`<span key=${c} class=${cx('absolute h-9 w-9 border-cyan-400', c)}></span>`)}
        </div>
        <p class="mt-3 text-center text-xs text-slate-500">${live ? html`Lecture live: <b class="text-navy-800">${lec.title}</b> in ${lec.room}` : html`<b class="text-rose-600">No lecture is live.</b> Start one from the Faculty role to see a successful scan.`}</p>
        <div class="mt-4 grid gap-2.5">
          <button class=${btn.cyan} onClick=${() => run(null)}><${Icon} n="check" c="h-4 w-4" />Simulate successful scan</button>
          <button class=${btn.ghost} onClick=${() => setMenu(!menu)}><${Icon} n="x" c="h-4 w-4 text-rose-500" />Simulate failed scan</button>
          ${menu && html`<div class="anim-pop space-y-1.5 rounded-xl border border-slate-200 p-2">${FAIL_REASONS.map((f) => html`<button key=${f.label} onClick=${() => run(f)} class="w-full rounded-lg px-3 py-2 text-left text-sm font-semibold text-navy-800 hover:bg-rose-50">${f.label}</button>`)}</div>`}
        </div></div>`}
      ${phase === 'verifying' && html`<ul class="space-y-2.5 py-2">${stepRow(0, 'Factor 1: QR token', 'Waiting')}${stepRow(1, 'Factor 2: BLE proximity', 'Waiting')}</ul>`}
      ${phase === 'result' && res && (res.ok ? html`<div class="anim-pop text-center">
        <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-500 text-white"><${Icon} n="check" c="h-9 w-9" /></span>
        <h3 class="mt-4 font-display text-xl font-bold text-navy-900">Attendance marked</h3><p class="mt-1 text-sm text-slate-500">${res.lec.title}</p>
        <dl class="mt-5 grid grid-cols-2 gap-2 text-left text-xs"><div class="rounded-xl bg-slate-50 p-3"><dt class="text-slate-500">Time</dt><dd class="mt-0.5 font-bold text-navy-900">${res.time}</dd></div><div class="rounded-xl bg-slate-50 p-3"><dt class="text-slate-500">Room</dt><dd class="mt-0.5 font-bold text-navy-900">${res.lec.room}</dd></div><div class="rounded-xl bg-slate-50 p-3"><dt class="text-slate-500">BLE signal</dt><dd class="mt-0.5 font-bold text-navy-900">${res.rssi} dBm · ~${res.dist} m</dd></div><div class="rounded-xl bg-slate-50 p-3"><dt class="text-slate-500">Verified by</dt><dd class="mt-0.5 font-bold text-navy-900">QR + BLE</dd></div></dl>
        <button class=${cx(btn.primary, 'mt-5 w-full')} onClick=${onClose}>Back to dashboard</button></div>` : html`<div class="anim-pop text-center">
        <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-rose-500 text-white"><${Icon} n="x" c="h-9 w-9" /></span>
        <h3 class="mt-4 font-display text-xl font-bold text-navy-900">Verification failed</h3><p class="mx-auto mt-2 max-w-xs text-sm leading-relaxed text-slate-600">${res.reason}</p>
        <div class="mt-5 grid grid-cols-2 gap-2"><button class=${btn.ghost} onClick=${onClose}>Close</button><button class=${btn.primary} onClick=${() => { setPhase('ready'); setSteps(['idle', 'idle']); setRes(null); }}>Try again</button></div></div>`)}
    </div>
  <//>`;
}

function FacultyLive({ app }) {
  const { st } = app, live = st.live;
  const lec = live && st.lectures.find((l) => l.id === live.lectureId);
  const [q, setQ] = useState({ seed: rand(1, 1e9), left: 15 });
  const [scanning, setScanning] = useState(false);
  const [filter, setFilter] = useState('all'), [search, setSearch] = useState('');
  const [sel, setSel] = useState('L1');
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  useEffect(() => {
    if (!live) return;
    const t = setInterval(() => setQ((p) => (p.left <= 1 ? { seed: rand(1, 1e9), left: 15 } : { seed: p.seed, left: p.left - 1 })), 1000);
    return () => clearInterval(t);
  }, [!!live]);

  if (!live) {
    const upcoming = st.lectures.filter((l) => l.status === 'upcoming');

function adminData(att) {
  const rows = STUDENTS.map((s) => ({ ...s, ...overall(att, s.id) }));
  const tot = rows.reduce((a, r) => ({ p: a.p + r.p, t: a.t + r.t }), { p: 0, t: 0 });
  const depts = DEPTS.map((d) => { const m = rows.filter((r) => r.dept === d.name); const p = m.reduce((a, r) => a + r.p, 0), t = m.reduce((a, r) => a + r.t, 0); return { ...d, v: pct(p, t) }; });
  return { rows, rate: pct(tot.p, tot.t), depts, low: rows.filter((r) => r.v < 75).sort((a, b) => a.v - b.v) };
}

  const [sent, setSent] = useState({});
  return html`<div class="space-y-6"><div class="flex flex-wrap items-end justify-between gap-3"><div><h2 class="font-display text-2xl font-bold text-navy-900">Low-attendance alerts</h2><p class="mt-1 text-sm text-slate-500">${d.low.length} students are below the 75% requirement</p></div>
    <button class=${btn.primary} onClick=${() => { const n = {}; d.low.forEach((s) => (n[s.id] = true)); setSent(n); app.notify('success', 'Notices sent', `${d.low.length} students and their mentors were notified (simulated).`); }}><${Icon} n="bell" c="h-4 w-4" />Notify all</button></div>
    <${Card} pad=${false}>${d.low.length ? html`<ul class="divide-y divide-slate-100">${d.low.map((s) => html`<li key=${s.id} class="flex flex-wrap items-center gap-3 px-5 py-3.5"><${Avatar} name=${s.name} c="bg-rose-50 text-rose-700" /><div class="min-w-[160px] flex-1"><p class="text-sm font-semibold text-navy-900">${s.name}</p><p class="text-xs text-slate-500">${s.id} · ${s.cls} · ${s.dept}</p></div><div class="w-32"><${Bar} v=${s.v} /></div><span class="w-14 text-right text-sm font-bold text-rose-600">${s.v.toFixed(1)}%</span>
      ${sent[s.id] ? html`<${Chip} kind="green"><${Icon} n="check" c="h-3 w-3" />Notice sent<//>` : html`<button class=${btn.sm} onClick=${() => { setSent({ ...sent, [s.id]: true }); app.notify('success', 'Notice sent', `${s.name} was notified (simulated).`); }}>Send notice</button>`}</li>`)}</ul>` : html`<${Empty} icon="check" title="No alerts" sub="Every student is at or above 75%." />`}<//></div>`;
}

/* ============================================================ */
/*                            APP                               */
/* ============================================================ */
function App() {
  const [st, setSt] = useState(initState);
  const S = useRef(st);
  const commit = (n) => { S.current = n; setSt(n); };
  const [toasts, setToasts] = useState([]);
  const [role, setRole] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [scan, setScan] = useState(false);
  const [adminDept, setAdminDept] = useState('all');

  const notify = (type, title, msg) => { const id = uid(); setToasts((t) => [...t.slice(-3), { id, type, title, msg }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200); };
  const log = (s, type, text) => [{ id: uid(), type, text, time: nowStr() }, ...s.activity].slice(0, 30);

  const startLecture = (id) => {
    const s = S.current, lec = s.lectures.find((l) => l.id === id);
    if (s.live) { notify('error', 'Another lecture is live', 'End the current lecture before starting a new one.'); return false; }
    commit({ ...s, lectures: s.lectures.map((l) => (l.id === id ? { ...l, status: 'live' } : l)), live: { lectureId: id, present: {}, failed: 0, startedAt: nowStr() }, activity: log(s, 'info', `${lec.title} started`) });
    notify('success', 'Lecture started', 'Rotating QR is live and the BLE beacon is broadcasting.');
    return true;
  };
  const markPresent = (sid, method) => {
    const s = S.current;
    if (!s.live) return { ok: false };
    if (s.live.present[sid]) return { ok: false, dup: true };
    const lec = s.lectures.find((l) => l.id === s.live.lectureId), stu = STUDENTS.find((x) => x.id === sid), time = nowStr(), a = s.att[sid][lec.subject];
    const att = { ...s.att, [sid]: { ...s.att[sid], [lec.subject]: { p: a.p + 1, t: a.t + 1 } } };
    const history = sid === ME_ID ? [{ id: uid(), date: 'Today', time, subject: lec.subject, status: 'Present', method }, ...s.history] : s.history;
    commit({ ...s, att, history, live: { ...s.live, present: { ...s.live.present, [sid]: { time, method } } }, activity: log(s, 'success', `${stu.name} verified (${method})`) });
    return { ok: true, time, lec };
  };
  const failAttempt = (sid, reason) => {
    const s = S.current, stu = STUDENTS.find((x) => x.id === sid);
    commit({ ...s, live: s.live ? { ...s.live, failed: s.live.failed + 1 } : s.live, activity: log(s, 'error', `${stu.name}: ${reason}`) });
    notify('error', 'Verification failed', `${stu.name}: ${reason}`);
  };
  const endLecture = () => {
    const s = S.current; if (!s.live) return;
    const lec = s.lectures.find((l) => l.id === s.live.lectureId), att = { ...s.att };
    ROSTER.forEach((r) => { if (!s.live.present[r.id]) { const a = att[r.id][lec.subject]; att[r.id] = { ...att[r.id], [lec.subject]: { p: a.p, t: a.t + 1 } }; } });
    const count = Object.keys(s.live.present).length;
    const history = s.live.present[ME_ID] ? s.history : [{ id: uid(), date: 'Today', time: lec.time.slice(0, 5), subject: lec.subject, status: 'Absent', method: '—' }, ...s.history];
    commit({ ...s, att, history, lectures: s.lectures.map((l) => (l.id === lec.id ? { ...l, status: 'completed', result: { present: count, total: ROSTER.length } } : l)), live: null, activity: log(s, 'info', `${lec.title} ended: ${count}/${ROSTER.length} present`) });
    notify('info', 'Lecture ended', `${count} of ${ROSTER.length} students were present. Student and admin dashboards are updated.`);
  };
  const resetDemo = () => { commit(initState()); setScan(false); notify('info', 'Demo reset', 'Sample data restored to its starting state.'); };
  const app = { st, notify, startLecture, markPresent, failAttempt, endLecture, resetDemo, getState: () => S.current };

  const enter = (r) => { setRole(r); setPage('dashboard'); window.scrollTo(0, 0); };
  const switchRole = (r) => { setRole(r); setPage('dashboard'); setAdminDept('all'); window.scrollTo(0, 0); };
  const goto = (r, p) => { setRole(r); setPage(p); window.scrollTo(0, 0); };

  let body = null;
  if (role === 'student') body = page === 'attendance' ? html`<${StudentAttendance} app=${app} />` : page === 'lectures' ? html`<${StudentLectures} app=${app} />` : page === 'materials' ? html`<${StudentMaterials} app=${app} />` : html`<${StudentDashboard} app=${app} setPage=${setPage} openScan=${() => setScan(true)} />`;
  if (role === 'faculty') body = page === 'live' ? html`<${FacultyLive} app=${app} />` : page === 'roster' ? html`<${FacultyRoster} app=${app} />` : html`<${FacultyDashboard} app=${app} setPage=${setPage} />`;
  if (role === 'admin') body = page === 'students' ? html`<${AdminStudents} key=${adminDept} app=${app} initialDept=${adminDept} />` : page === 'departments' ? html`<${AdminDepartments} app=${app} openDept=${(n) => { setAdminDept(n); setPage('students'); }} />` : page === 'alerts' ? html`<${AdminAlerts} app=${app} />` : html`<${AdminDashboard} app=${app} setPage=${setPage} />`;

  return html`<div>
    ${role ? html`<${Shell} app=${app} role=${role} page=${page} setPage=${(p) => { setAdminDept('all'); setPage(p); }} switchRole=${switchRole} goto=${goto} onLogout=${() => setRole(null)}>${body}<//>` : html`<${Landing} onEnter=${enter} />`}
    ${scan && role === 'student' && html`<${Scanner} app=${app} onClose=${() => setScan(false)} />`}
    <${Toasts} items=${toasts} />
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
