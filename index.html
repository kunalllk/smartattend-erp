    ${data.map((d, i) => { const x = pl + i * bw + bw * 0.2, w = bw * 0.6; return html`<g key=${d.label}>
      <rect x=${x} y=${y(d.value)} width=${w} height=${pt + ih - y(d.value)} rx="6" fill=${colorFn ? colorFn(d.value) : '#0E2144'} />
      <text x=${x + w / 2} y=${y(d.value) - 6} textAnchor="middle" fontSize="11" fontWeight="700" fill="#0A1A38">${Math.round(d.value)}</text>
      <text x=${x + w / 2} y=${H - 10} textAnchor="middle" fontSize="10" fill="#64748B">${d.label}</text></g>`; })}
  </svg>`;
}

function LineChart({ data, h = 230 }) {
  const W = 560, H = h, pl = 34, pb = 30, pt = 16, pr = 14, iw = W - pl - pr, ih = H - pt - pb, lo = 60, hi = 100;
  const x = (i) => pl + (i * iw) / (data.length - 1), y = (v) => pt + ih - ((v - lo) / (hi - lo)) * ih;
  const pts = data.map((d, i) => `${x(i)},${y(d.value)}`).join(' ');
  const area = `${x(0)},${pt + ih} ${pts} ${x(data.length - 1)},${pt + ih}`;
  return html`<svg viewBox=${`0 0 ${W} ${H}`} class="h-auto w-full" role="img" aria-label="Line chart">
    ${[60, 70, 80, 90, 100].map((g) => html`<g key=${g}><line x1=${pl} x2=${W - pr} y1=${y(g)} y2=${y(g)} stroke="#E2E8F0" /><text x=${pl - 6} y=${y(g) + 4} textAnchor="end" fontSize="10" fill="#64748B">${g}</text></g>`)}
    <polygon points=${area} fill="#06B6D4" fillOpacity="0.12" />
    <polyline points=${pts} fill="none" stroke="#0E2144" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
    ${data.map((d, i) => html`<g key=${d.label}><circle cx=${x(i)} cy=${y(d.value)} r=${i === data.length - 1 ? 6 : 4} fill=${i === data.length - 1 ? '#06B6D4' : '#fff'} stroke="#0E2144" strokeWidth="2.5" />
      <text x=${x(i)} y=${y(d.value) - 11} textAnchor="middle" fontSize="11" fontWeight="700" fill="#0A1A38">${d.value.toFixed(1)}</text>
      <text x=${x(i)} y=${H - 10} textAnchor="middle" fontSize="10" fill="#64748B">${d.label}</text></g>`)}
  </svg>`;
}

/* ---------- Real Vector SVG QR Component (Standard ISO/IEC 18004) ---------- */
function RealQR({ text, size = 230, fg = '#0A1A38' }) {
  const qrSvg = useMemo(() => {
    try {
      if (typeof qrcode !== 'undefined' && text) {
        const qr = qrcode(0, 'M');
        qr.addData(String(text));
        qr.make();
        const count = qr.getModuleCount();
        const margin = 2;
        let d = '';
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              d += `M${c + margin} ${r + margin}h1v1h-1z `;
            }
          }
        }
        const totalSize = count + margin * 2;
        return { totalSize, d };
      }
    } catch (err) {
      console.warn('QR generation note:', err);
    }
    return null;
  }, [text]);

  if (!qrSvg) {
    return html`<div class="flex flex-col items-center justify-center rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-400 font-semibold" style=${{ width: size, height: size }}>
      <span class="anim-blink h-2 w-2 rounded-full bg-cyan-500 mb-2"></span>
      Generating QR...
    </div>`;
  }

  return html`<svg width=${size} height=${size} viewBox=${`0 0 ${qrSvg.totalSize} ${qrSvg.totalSize}`} class="rounded-xl shadow-sm" shapeRendering="crispEdges" role="img" aria-label="Attendance QR Code">
    <rect width=${qrSvg.totalSize} height=${qrSvg.totalSize} fill="#ffffff" />
    <path d=${qrSvg.d} fill=${fg} />
  </svg>`;
}

/* ============================================================ */
/*            REAL CAMERA QR SCANNER + BLE VERIFICATION         */
/* ============================================================ */
function Scanner({ app, onClose }) {
  const [phase, setPhase] = useState('camera'); // 'camera' | 'verifying' | 'result'
  const [steps, setSteps] = useState(['idle']); // [qr_step]
  const [res, setRes] = useState(null);
  const [cameraError, setCameraError] = useState(null);
  const [activeToken, setActiveToken] = useState(null);
  const html5QrCodeRef = useRef(null);

  // Initialize Camera Scanner
  useEffect(() => {
    let scanner = null;
    if (phase === 'camera') {
      try {
        scanner = new Html5Qrcode('reader');
        html5QrCodeRef.current = scanner;
        const config = { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 };
        scanner.start(
          { facingMode: 'environment' },
          config,
          (decodedText) => {
            // QR code scanned! Stop scanner and start verification
            if (scanner && scanner.isScanning) {
              scanner.stop().catch(() => {}).then(() => {
                onQrScanned(decodedText);
              });
            } else {
              onQrScanned(decodedText);
            }
          },
          () => {} // frame error handler (ignored)
        ).catch((err) => {
          console.warn('Camera start error:', err);
          setCameraError(err?.message || 'Unable to access device camera. Please check camera permissions.');
        });
      } catch (err) {
        setCameraError('Camera initialization failed: ' + err.message);
      }
    }

    return () => {
      if (html5QrCodeRef.current && html5QrCodeRef.current.isScanning) {
        html5QrCodeRef.current.stop().catch(() => {});
      }
    };
  }, [phase]);

  // Attendance Verification Flow (Dynamic Server QR)
  const onQrScanned = async (qrString) => {
    setActiveToken(qrString);
    setPhase('verifying');
    setSteps(['run']);

    // Step 1: Validate QR token format
    const parts = (qrString || '').split(':');
    if (parts.length < 3) {
      setSteps(['fail']);
      setPhase('result');
      setRes({ ok: false, reason: 'Invalid QR code. Please scan the official SmartAttend lecture QR.' });
      return;
    }

    // Step 2: Backend Validation (/api/attendance/verify)
    try {
      const response = await fetch('/api/attendance/verify', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': app.authSession?.access_token ? `Bearer ${app.authSession.access_token}` : '',
        },
        body: JSON.stringify({
          token_string: qrString,
          student_id: app.userProfile?.id || ME_ID,
          metadata: { device: navigator.userAgent },
        }),
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        setSteps(['fail']);
        setPhase('result');
        setRes({ ok: false, reason: data.message || data.error || 'Verification rejected by server.' });
        app.notify('error', 'Attendance rejected', data.message || 'Server rejected verification');
        return;
      }

      // Success!
      setSteps(['ok']);
      setPhase('result');
      setRes({
        ok: true,
        time: data.time || nowStr(),
        title: data.title || 'Data Structures',
        room: data.room || 'LT-204',
      });

      // Update local student & lecture state
      app.recordVerifiedAttendance({
        subject: 'CS301',
        time: data.time || nowStr(),
        method: 'Dynamic QR Verified',
      });
      app.notify('success', 'Attendance marked successfully', `${data.title || 'Data Structures'} at ${data.time}`);
    } catch (err) {
      setSteps(['fail']);
      setPhase('result');
      setRes({ ok: false, reason: 'Network error communicating with attendance verification API.' });
    }
  };

  const stepRow = (i, title, sub) => {
    const s = steps[i];
    return html`<li class="flex items-center gap-3 rounded-xl border border-slate-200 p-3">
      <span class=${cx('flex h-8 w-8 items-center justify-center rounded-full text-white', s === 'ok' ? 'bg-emerald-500' : s === 'fail' ? 'bg-rose-500' : s === 'run' ? 'bg-cyan-500' : 'bg-slate-200')}>${s === 'ok' ? html`<${Icon} n="check" c="h-4 w-4" />` : s === 'fail' ? html`<${Icon} n="x" c="h-4 w-4" />` : s === 'run' ? html`<span class="anim-blink h-2.5 w-2.5 rounded-full bg-white"></span>` : html`<${Icon} n="qr" c="h-4 w-4" />`}</span>
      <div><p class="text-sm font-semibold text-navy-900">${title}</p><p class="text-xs text-slate-500">${s === 'run' ? 'Verifying with server…' : s === 'ok' ? 'Passed' : s === 'fail' ? 'Failed' : sub}</p></div></li>`;
  };

  return html`<${Modal} onClose=${onClose}>
    <div class="flex items-center justify-between bg-navy-900 px-5 py-4 text-white">
      <div class="flex items-center gap-2.5"><${Icon} n="camera" c="h-5 w-5 text-cyan-300" /><span class="font-display text-sm font-semibold">Camera QR Scanner</span></div>
      <button onClick=${onClose} class="rounded-lg p-1.5 hover:bg-white/10" aria-label="Close scanner"><${Icon} n="x" c="h-5 w-5" /></button>
    </div>
    <div class="space-y-4 p-5">
      ${phase === 'camera' && html`<div>
        <div class="relative mx-auto aspect-square w-full max-w-[300px] overflow-hidden rounded-2xl bg-navy-950 flex items-center justify-center">
          <div id="reader" class="w-full h-full"></div>
          ${cameraError && html`<div class="p-4 text-center text-xs text-white">
            <p class="font-bold text-rose-400">Camera Unavailable</p>
            <p class="mt-1 text-slate-300">${cameraError}</p>
            <p class="mt-3 text-[11px] text-cyan-300">Grant camera permissions in your browser or test via mobile device.</p>
          </div>`}
        </div>
        <p class="mt-3 text-center text-xs text-slate-500">Point your camera at the faculty screen QR code.</p>
        <div class="mt-4 flex flex-col gap-2">
          ${app.st.live && html`<button class=${btn.ghost} onClick=${() => onQrScanned(app.st.live.current_token || `${app.st.live.lectureId}:1700000000:devtoken`)}><${Icon} n="qr" c="h-4 w-4 text-cyan-600" />Test with active lecture token</button>`}
        </div>
      </div>`}

      ${phase === 'verifying' && html`<div>
        <p class="text-sm font-bold text-navy-900 mb-3">Dynamic QR Cryptographic Verification</p>
        <ul class="space-y-2.5 py-2">
          ${stepRow(0, 'Dynamic Server QR Token', 'Verifying SHA-256 token with server')}
        </ul>
      </div>`}

      ${phase === 'result' && res && (res.ok ? html`<div class="anim-pop text-center">
        <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-500 text-white"><${Icon} n="check" c="h-9 w-9" /></span>
        <h3 class="mt-4 font-display text-xl font-bold text-navy-900">Attendance Marked Successfully</h3>
        <p class="mt-1 text-sm text-slate-500">${res.title}</p>
        <dl class="mt-5 grid grid-cols-2 gap-2 text-left text-xs">
          <div class="rounded-xl bg-slate-50 p-3"><dt class="text-slate-500">Server Time</dt><dd class="mt-0.5 font-bold text-navy-900">${res.time}</dd></div>
          <div class="rounded-xl bg-slate-50 p-3"><dt class="text-slate-500">Room</dt><dd class="mt-0.5 font-bold text-navy-900">${res.room}</dd></div>
          <div class="rounded-xl bg-slate-50 p-3 col-span-2"><dt class="text-slate-500">Verification</dt><dd class="mt-0.5 font-bold text-emerald-700">Dynamic Server QR Validated</dd></div>
        </dl>
        <button class=${cx(btn.primary, 'mt-5 w-full')} onClick=${onClose}>Back to Dashboard</button>
      </div>` : html`<div class="anim-pop text-center">
        <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-rose-500 text-white"><${Icon} n="x" c="h-9 w-9" /></span>
        <h3 class="mt-4 font-display text-xl font-bold text-navy-900">Verification Failed</h3>
        <p class="mx-auto mt-2 max-w-xs text-sm leading-relaxed text-slate-600">${res.reason}</p>
        <div class="mt-5 grid grid-cols-2 gap-2">
          <button class=${btn.ghost} onClick=${onClose}>Close</button>
          <button class=${btn.primary} onClick=${() => { setPhase('camera'); setSteps(['idle']); setRes(null); }}>Try again</button>
        </div>
      </div>`)}
    </div>
  <//>`;
}

        const data = await res.json();
        if (data && data.ok && data.token) {
          setCurrentToken(data.token);
          setSecondsLeft(15);
          app.updateLiveToken(data.token);
          return;
        }
      } catch (err) {
        console.warn('Failed to rotate server token:', err);
      }
      // Resilient fallback token if server endpoint is slow or unreachable

      setCurrentToken(fallbackToken);
      setSecondsLeft(15);
      app.updateLiveToken(fallbackToken);
    };

    // Initial fetch if needed
    fetchNextToken();

    countdownInterval = setInterval(() => {
      setSecondsLeft((prev) => {
        if (prev <= 1) {

function adminData(att) {
  const rows = STUDENTS.map((s) => ({ ...s, ...overall(att, s.id) }));
  const tot = rows.reduce((a, r) => ({ p: a.p + r.p, t: a.t + r.t }), { p: 0, t: 0 });
  const depts = DEPTS.map((d) => { const m = rows.filter((r) => r.dept === d.name); const p = m.reduce((a, r) => a + r.p, 0), t = m.reduce((a, r) => a + r.t, 0); return { ...d, v: pct(p, t) }; });
  return { rows, rate: pct(tot.p, tot.t), depts, low: rows.filter((r) => r.v < 75).sort((a, b) => a.v - b.v) };
}

  return html`<div class="space-y-6"><div><h2 class="font-display text-2xl font-bold text-navy-900">Departments</h2><p class="mt-1 text-sm text-slate-500">Seven engineering departments with two-factor attendance</p></div>
    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">${d.depts.map((x) => { const tn = tone(x.v); return html`<div key=${x.name} class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><div class="flex items-start justify-between gap-3"><div><h3 class="font-display text-[15px] font-semibold text-navy-900">${x.full}</h3><p class="mt-0.5 text-xs text-slate-500">HoD: ${x.hod}</p></div><span class=${cx('rounded-full px-2.5 py-0.5 text-[11px] font-bold', tn.bg, tn.t)}>${x.v.toFixed(1)}%</span></div>
      <div class="mt-4"><${Bar} v=${x.v} /></div><div class="mt-4 flex gap-6 text-xs text-slate-500"><span><b class="text-sm text-navy-900">${x.students.toLocaleString('en-IN')}</b> students</span><span><b class="text-sm text-navy-900">${x.faculty}</b> faculty</span></div>
      <button class=${cx(btn.sm, 'mt-4 w-full')} onClick=${() => openDept(x.name)}>View students</button></div>`; })}</div></div>`;
}

function AdminAlerts({ app }) {
  const d = useMemo(() => adminData(app.st.att), [app.st.att]);
  const [sent, setSent] = useState({});
  return html`<div class="space-y-6"><div class="flex flex-wrap items-end justify-between gap-3"><div><h2 class="font-display text-2xl font-bold text-navy-900">Low-attendance alerts</h2><p class="mt-1 text-sm text-slate-500">${d.low.length} students are below the 75% exam eligibility threshold</p></div>
    <button class=${btn.primary} onClick=${() => { const n = {}; d.low.forEach((s) => (n[s.id] = true)); setSent(n); app.notify('success', 'Official notices issued', `${d.low.length} students notified with official warning notices.`); }}><${Icon} n="bell" c="h-4 w-4" />Notify all</button></div>
    <${Card} pad=${false}>${d.low.length ? html`<ul class="divide-y divide-slate-100">${d.low.map((s) => html`<li key=${s.id} class="flex flex-wrap items-center gap-3 px-5 py-3.5"><${Avatar} name=${s.name} c="bg-rose-50 text-rose-700" /><div class="min-w-[160px] flex-1"><p class="text-sm font-semibold text-navy-900">${s.name}</p><p class="text-xs text-slate-500">${s.id} · ${s.cls} · ${s.dept}</p></div><div class="w-32"><${Bar} v=${s.v} /></div><span class="w-14 text-right text-sm font-bold text-rose-600">${s.v.toFixed(1)}%</span>
      ${sent[s.id] ? html`<${Chip} kind="green"><${Icon} n="check" c="h-3 w-3" />Notice sent<//>` : html`<button class=${btn.sm} onClick=${() => { setSent({ ...sent, [s.id]: true }); app.notify('success', 'Notice dispatched', `${s.name} was notified.`); }}>Send notice</button>`}</li>`)}</ul>` : html`<${Empty} icon="check" title="No alerts" sub="Every enrolled student is at or above 75%." />`}<//></div>`;
}

/* ============================================================ */
/*                      ROOT APP COMPONENT                      */
/* ============================================================ */
function App() {
  const [st, setSt] = useState(initState);
  const S = useRef(st);
  const commit = (n) => { S.current = n; setSt(n); };

  const [toasts, setToasts] = useState([]);
  const [role, setRole] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [scan, setScan] = useState(false);
  const [adminDept, setAdminDept] = useState('all');
  const [loggingIn, setLoggingIn] = useState(false);
  const [authSession, setAuthSession] = useState(null);
  const [userProfile, setUserProfile] = useState(null);
  const [devTestMode, setDevTestMode] = useState(true); // Default true for frictionless testing across all browsers

  const notify = (type, title, msg) => {
    const id = uid();
    setToasts((t) => [...t.slice(-3), { id, type, title, msg }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200);
  };

  const log = (s, type, text) => [{ id: uid(), type, text, time: nowStr() }, ...s.activity].slice(0, 30);

  // Initialize frontend Supabase client with Realtime WebSockets if configured
  useEffect(() => {
    fetch('/api/config')
      .then((r) => r.json())
      .then((cfg) => {
        if (cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase && !window.supabaseClient) {
          window.supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
          console.log('Supabase client initialized on frontend with Realtime support.');
        }
      })
      .catch(() => {});
  }, []);

  // Cross-tab real-time sync listener (Faculty screen receives instant update if student scans in another tab)
  useEffect(() => {
    let bc = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        bc = new BroadcastChannel('smartattend_sync');
        bc.onmessage = (ev) => {
          if (ev.data && ev.data.type === 'STUDENT_SCANNED') {
            syncLiveAttendance([{
              student_id: ev.data.studentId,
              roll_number: ev.data.rollNumber,
              name: ev.data.name,
              time: ev.data.time,
              method: ev.data.method,
            }]);
          }
        };
      }
    } catch (e) {}

    const onStorage = (e) => {
      if (e.key === 'smartattend_last_scan' && e.newValue) {
        try {
          const d = JSON.parse(e.newValue);
          syncLiveAttendance([{
            student_id: d.studentId,
            roll_number: d.rollNumber,
            name: d.name,
            time: d.time,
            method: d.method,
          }]);
        } catch (err) {}
      }
    };
    window.addEventListener('storage', onStorage);

    return () => {
      if (bc) bc.close();
      window.removeEventListener('storage', onStorage);
    };
  }, []);

  // Realtime Supabase Channel Subscription
  useEffect(() => {
    // If Supabase client is available and a lecture is live, subscribe to attendance inserts
    let realtimeChannel = null;
    const currentLive = S.current.live;

    if (window.supabase && window.supabaseClient && currentLive?.session_id) {
      realtimeChannel = window.supabaseClient
        .channel(`public:attendance:session_${currentLive.session_id}`)
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'attendance',
            filter: `lecture_session_id=eq.${currentLive.session_id}`,
          },
          (payload) => {
            const newRecord = payload.new;
            const stu = STUDENTS.find((x) => x.id === newRecord.student_id) || { name: 'Aarav Sharma', id: ME_ID };
            const time = new Date(newRecord.marked_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

            const s = S.current;
            if (s.live) {
              const studentKey = (stu.id === ME_ID || stu.name === 'Aarav Sharma') ? ME_ID : stu.id;
              commit({
                ...s,
                live: {
                  ...s.live,
                  present: {
                    ...s.live.present,
                    [studentKey]: { time, method: 'Dynamic QR' },
                    [newRecord.student_id]: { time, method: 'Dynamic QR' }
                  }
                },
                activity: log(s, 'success', `${stu.name} verified live (Dynamic QR)`),
              });
              notify('success', 'Realtime Check-in', `${stu.name} marked present.`);
            }
          }
        )
        .subscribe();
    }

    return () => {
      if (realtimeChannel && window.supabaseClient) {
        window.supabaseClient.removeChannel(realtimeChannel);
      }
    };
  }, [st.live?.session_id]);

  // Start Lecture (Calls Backend /api/session/start)
  const startLecture = async (lecId) => {
    const s = S.current, lec = s.lectures.find((l) => l.id === lecId);
    if (s.live) {
      notify('error', 'Lecture already active', 'End the ongoing lecture before launching another.');
      return false;
    }

    let sessionId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'b' + Math.random().toString(16).substring(2, 10) + '-0000-4000-8000-' + Date.now().toString(16).padStart(12, '0');
    let bleId = 'SA-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    let initialToken = `${sessionId}:${Math.floor(Date.now() / 1000)}:init`;

    try {
      const response = await fetch('/api/session/start', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': authSession?.access_token ? `Bearer ${authSession.access_token}` : '',
        },
        body: JSON.stringify({
          title: lec.title,
          room: lec.room,
          topic: lec.topic,
          subject_code: lec.subject,
          class_section: lec.cls,
          duration_minutes: 60,
        }),
      });

      const data = await response.json();
      if (data && data.ok) {
        if (data.session_id) sessionId = data.session_id;
        if (data.ble_session_identifier) bleId = data.ble_session_identifier;
        if (data.initial_token) initialToken = data.initial_token;
      }
    } catch (err) {
      console.warn('Start lecture backend note:', err.message);
    }

    // Broadcast BLE beacon if supported
    window.SmartAttendBle?.startAdvertising(bleId);

    commit({
      ...s,
      lectures: s.lectures.map((l) => (l.id === lecId ? { ...l, status: 'live' } : l)),
      live: {
        lectureId: lecId,
        session_id: sessionId,
        ble_session_identifier: bleId,
        current_token: initialToken,
        title: lec.title,
        room: lec.room,
        present: {},
        failed: 0,
        startedAt: nowStr(),
      },
      activity: log(s, 'info', `${lec.title} started: Dynamic QR active`),
    });

    notify('success', 'Lecture started', 'Live dynamic QR active with 15s token rotation.');
    return true;
  };

  // End Lecture (Calls Backend /api/session/end)
  const endLecture = async () => {
    const s = S.current;
    if (!s.live) return;
    const lec = s.lectures.find((l) => l.id === s.live.lectureId) || { id: 'L1', title: 'Data Structures · Theory', subject: 'CS301' };

    try {
      if (s.live.session_id) {
        await fetch('/api/session/end', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: s.live.session_id }),
        });
      }
    } catch (e) {
      console.warn('End lecture API notice:', e);
    }

    const att = { ...s.att };
    ROSTER.forEach((r) => {
      if (!s.live.present[r.id]) {
        const a = att[r.id]?.[lec.subject] || { p: 28, t: 34 };
        att[r.id] = { ...att[r.id], [lec.subject]: { p: a.p, t: a.t + 1 } };
      }
    });

    const count = Object.keys(s.live.present).length;
    const history = s.live.present[ME_ID]
      ? s.history
      : [{ id: uid(), date: 'Today', time: nowStr(), subject: lec.subject, status: 'Absent', method: '—' }, ...s.history];

    commit({
      ...s,
      att,
      history,
      lectures: s.lectures.map((l) => (l.id === lec.id ? { ...l, status: 'completed', result: { present: count, total: ROSTER.length } } : l)),
      live: null,
      activity: log(s, 'info', `${lec.title} ended: ${count}/${ROSTER.length} present`),
    });

    notify('info', 'Lecture ended', `${count} of ${ROSTER.length} students recorded present in Supabase.`);
  };

  const updateLiveToken = (newToken) => {
    if (S.current.live) {
      commit({
        ...S.current,
        live: { ...S.current.live, current_token: newToken }
      });
    }
  };

  // Sync attendees fetched from PostgreSQL /api/session/live into faculty live dashboard
  const syncLiveAttendance = (attendees) => {
    if (!attendees || !Array.isArray(attendees)) return;
    const s = S.current;
    if (!s.live) return;

    const currentPresent = s.live.present || {};
    let changed = false;
    const updatedPresent = { ...currentPresent };

    attendees.forEach((att) => {
      const stu = STUDENTS.find((x) => x.id === att.roll_number || x.id === att.student_id || x.name === att.name) || {
        id: att.roll_number || ME_ID,
        name: att.name || 'Aarav Sharma',
      };

      const key = stu.id;
      if (!updatedPresent[key]) {
        updatedPresent[key] = {
          time: att.time || nowStr(),
          method: 'Dynamic QR',
        };
        changed = true;
      }
      if ((att.roll_number === 'S2301' || att.name === 'Aarav Sharma') && !updatedPresent[ME_ID]) {
        updatedPresent[ME_ID] = {
          time: att.time || nowStr(),
          method: 'Dynamic QR',
        };
        changed = true;
      }
    });

    if (changed) {
      commit({
        ...s,
        live: {
          ...s.live,
          present: updatedPresent,
        },
      });
    }
  };

  const recordVerifiedAttendance = ({ subject = 'CS301', time, method }) => {
    const s = S.current;
    const currentLive = s.live;
    const currentLec = currentLive ? s.lectures.find((l) => l.id === currentLive.lectureId) : null;
    const subjCode = currentLec ? currentLec.subject : subject;

    const curAtt = s.att[ME_ID]?.[subjCode] || { p: 28, t: 34 };
    const newAtt = {
      ...s.att,
      [ME_ID]: {
        ...s.att[ME_ID],
        [subjCode]: { p: curAtt.p + 1, t: curAtt.t + 1 },
      },
    };

    const newHistory = [
      { id: uid(), date: 'Today', time: time || nowStr(), subject: subjCode, status: 'Present', method: method || 'Dynamic QR' },
      ...s.history,
    ];

    commit({
      ...s,
      att: newAtt,
      history: newHistory,
      live: currentLive ? {
        ...currentLive,
        present: {
          ...currentLive.present,
          [ME_ID]: { time: time || nowStr(), method: method || 'Dynamic QR' },
        },
      } : currentLive,
      activity: log(s, 'success', `Aarav Sharma verified (${method || 'Dynamic QR'})`),
    });

    // Cross-tab and cross-window real-time synchronization
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('smartattend_sync');
        bc.postMessage({
          type: 'STUDENT_SCANNED',
          studentId: ME_ID,
          rollNumber: 'S2301',
          name: 'Aarav Sharma',
          time: time || nowStr(),
          method: method || 'Dynamic QR',
        });
        bc.close();
      }
      localStorage.setItem('smartattend_last_scan', JSON.stringify({
        ts: Date.now(),
        studentId: ME_ID,
        rollNumber: 'S2301',
        name: 'Aarav Sharma',
        time: time || nowStr(),
        method: method || 'Dynamic QR',
      }));
    } catch (e) {}
  };

  // Sign in to role with real Supabase Auth
  const handleEnter = async (r) => {
    setLoggingIn(true);
    const fallbackProfile = {
      name: r === 'student' ? 'Aarav Sharma' : r === 'faculty' ? 'Dr. Meera Kulkarni' : 'Prof. Rohan Deshmukh',
      sub: r === 'student' ? 'CSE-3A · S2301' : r === 'faculty' ? 'Dept. of CSE' : 'Academic Office',
      id: r === 'student' ? ME_ID : uid(),
    };

    try {
      const res = await fetch(`/api/auth-demo?role=${r}`);
      const data = await res.json();

      if (data && data.ok) {
        setAuthSession(data.session || null);
        setUserProfile(data.profile || {
          name: data.user?.user_metadata?.full_name || fallbackProfile.name,
          sub: fallbackProfile.sub,
          id: data.user?.id || fallbackProfile.id,
        });
        setRole(r);
        setPage('dashboard');
        notify('success', 'Authenticated', `Signed in as ${r.toUpperCase()} with Supabase.`);
      } else {
        setUserProfile(fallbackProfile);
        setRole(r);
        setPage('dashboard');
      }
    } catch (err) {
      console.warn('Auth fetch note:', err);
      setUserProfile(fallbackProfile);
      setRole(r);
      setPage('dashboard');
    } finally {
      setLoggingIn(false);
      window.scrollTo(0, 0);
    }
  };

  const handleLogout = () => {
    setRole(null);
    setAuthSession(null);
    setUserProfile(null);
    setScan(false);
  };

  const switchRole = (r) => {
    handleEnter(r);
  };

  const app = {
    st,
    notify,
    startLecture,
    endLecture,
    updateLiveToken,
    syncLiveAttendance,
    recordVerifiedAttendance,
    userProfile,
    authSession,
    devTestMode,
    setDevTestMode,
  };

  let body = null;
  if (role === 'student') body = page === 'attendance' ? html`<${StudentAttendance} app=${app} />` : page === 'lectures' ? html`<${StudentLectures} app=${app} />` : page === 'materials' ? html`<${StudentMaterials} app=${app} />` : html`<${StudentDashboard} app=${app} setPage=${setPage} openScan=${() => setScan(true)} />`;
  if (role === 'faculty') body = page === 'live' ? html`<${FacultyLive} app=${app} />` : page === 'roster' ? html`<${FacultyRoster} app=${app} />` : html`<${FacultyDashboard} app=${app} setPage=${setPage} />`;
  if (role === 'admin') body = page === 'students' ? html`<${AdminStudents} key=${adminDept} app=${app} initialDept=${adminDept} />` : page === 'departments' ? html`<${AdminDepartments} app=${app} openDept=${(n) => { setAdminDept(n); setPage('students'); }} />` : page === 'alerts' ? html`<${AdminAlerts} app=${app} />` : html`<${AdminDashboard} app=${app} setPage=${setPage} />`;

  return html`<div>
    ${role ? html`<${Shell} app=${app} role=${role} page=${page} setPage=${(p) => { setAdminDept('all'); setPage(p); }} switchRole=${switchRole} onLogout=${handleLogout}>${body}<//>` : html`<${Landing} onEnter=${handleEnter} loggingIn=${loggingIn} />`}
    ${scan && role === 'student' && html`<${Scanner} app=${app} onClose=${() => setScan(false)} />`}
    <${Toasts} items=${toasts} />
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
